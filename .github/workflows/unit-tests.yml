name: Unit tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.dependency-set }} dependencies
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        - dependency-set: lower-bound
          python-version: '3.12'
          constraints: requirements-lower-bound.txt
        - dependency-set: latest
          python-version: '3.14'
          constraints: ''
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Pandana
      shell: bash
      run: |
        python -m pip install --upgrade pip setuptools wheel build
        python -m build --wheel
        if [ -n "${{ matrix.constraints }}" ]; then
          python -m pip install -c "${{ matrix.constraints }}" dist/*.whl
        else
          python -m pip install dist/*.whl
        fi
        python -m pip install pytest
    - name: Show dependency versions
      run: |
        python -c "import numpy, pandas, pandana; print('numpy', numpy.__version__); print('pandas', pandas.__version__); print('pandana', pandana.__version__)"
        python -m pip check
    - name: Run unit tests
      shell: bash
      run: |
        mkdir test-run
        cd test-run
        python -m pytest --import-mode=importlib "$GITHUB_WORKSPACE/tests" -q
