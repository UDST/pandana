name: Unit tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'
    - name: Install Pandana
      run: |
        python -m pip install --upgrade pip setuptools wheel
        python -m pip install .
        python -m pip install pytest
    - name: Run unit tests
      run: |
        python -m pytest -q
