name: Installation

# This workflow installs the latest released Pandana from PyPI and Conda Forge across
# a range of Python versions and operating systems. You can run it manually after a
# new release is posted to confirm that it installs smoothly. It also runs weekly in
# the background to catch dependency updates that break Pandana.
#
# It tests whatever is currently published, not this branch, so expect failures for
# Python versions that the latest release doesn't yet provide binaries for.

on:
  workflow_dispatch:
  schedule:
  - cron: '0 3 * * 1'  # every Monday at 3am UTC (Sunday evening Calif time)

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-pip:
    name: pip / ${{ matrix.os }} / ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Pandana
      run: |
        pip install --only-binary pandana pandana
    - name: Run demo
      run: |
        python examples/simple_example.py

  build-conda:
    name: conda / ${{ matrix.os }} / ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash -l {0}  # needed for conda persistence
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python ${{ matrix.python-version }}
      uses: conda-incubator/setup-miniconda@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Pandana
      run: |
        conda install pandana --channel conda-forge
    - name: Run demo
      run: |
        python examples/simple_example.py
