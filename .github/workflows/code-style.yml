name: Code style

# This workflow runs code style checks.

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'
    - name: Check code style
      run: |
        pip install pycodestyle
        pycodestyle pandana
