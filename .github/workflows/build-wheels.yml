name: Build wheels

# Builds and tests the binary installers ("wheels") and the source distribution.
# This runs on every pull request, to confirm nothing is broken, and again when a
# release is published on GitHub, in which case the files are then uploaded to PyPI
# using Trusted Publishing. Merging to main never publishes anything; only publishing
# a release on GitHub (which creates or points at a v* tag) does, and the upload step
# waits for approval in the protected "pypi" environment. See CONTRIBUTING.md.

on:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:  # build and verify only, without publishing

permissions:
  contents: read

# Cancel superseded runs for a pull request, but never a release run, which may be
# partway through an upload
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The Python versions to build wheels for. cibuildwheel reads this in the build
  # jobs, and the check-dist job uses it to confirm that nothing is missing
  CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-* cp315-*"

jobs:
  build-wheels:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: Linux x86_64 wheels
          os: ubuntu-latest
          cibw-archs: x86_64
          openmp: GCC/libgomp OpenMP enabled
        - name: Linux aarch64 wheels
          os: ubuntu-24.04-arm
          cibw-archs: aarch64
          openmp: GCC/libgomp OpenMP enabled
        - name: macOS x86_64 wheels
          os: macos-15-intel
          cibw-archs: x86_64
          openmp: Apple clang with Homebrew libomp bundled by delocate
          macos-target: '14.0'  # Homebrew's Intel libomp bottle is built for Sonoma
        - name: macOS arm64 wheels
          os: macos-15
          cibw-archs: arm64
          openmp: Apple clang with Homebrew libomp bundled by delocate
          macos-target: '15.0'
        - name: Windows AMD64 wheels
          os: windows-latest
          cibw-archs: AMD64
          openmp: MSVC /openmp enabled

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Show wheel target
      run: |
        echo "cibuildwheel architectures: ${{ matrix.cibw-archs }}"
        echo "OpenMP target: ${{ matrix.openmp }}"
    - name: Build wheels
      uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e # v4.3.5
      env:
        CIBW_SKIP: "*-musllinux_*"
        CIBW_ARCHS: ${{ matrix.cibw-archs }}
        CIBW_BUILD_VERBOSITY: 1
        CIBW_TEST_REQUIRES: "pytest"
        # Run the unit tests, then confirm the wheel is actually multithreaded.
        CIBW_TEST_COMMAND: >
          python -m pytest --import-mode=importlib {project}/tests -q &&
          python {project}/tests/check_openmp.py
        # macOS: Apple's clang has no OpenMP runtime of its own, so install
        # LLVM's libomp from Homebrew on the runner, point the compiler at it,
        # and let delocate copy the dylib into the wheel so it is self-contained.
        # The deployment target has to match the Homebrew bottle's minimum OS
        # for delocate to accept the library; it differs by architecture. Same approach as Pandarm PR #59
        # (github.com/oturns/pandarm/pull/59).
        CIBW_BEFORE_BUILD_MACOS: brew install libomp
        CIBW_ENVIRONMENT_MACOS: >
          CC=clang
          CXX=clang++
          CPPFLAGS="-I$(brew --prefix libomp)/include"
          LDFLAGS="-L$(brew --prefix libomp)/lib"
          MACOSX_DEPLOYMENT_TARGET=${{ matrix.macos-target }}
        CIBW_REPAIR_WHEEL_COMMAND_MACOS: >
          delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}
    - name: Save artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: wheels-${{ matrix.os }}
        path: wheelhouse/*.whl
        if-no-files-found: error

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.14'
    - name: Build sdist
      run: |
        python -m pip install --upgrade pip build
        python -m build --sdist
    - name: Save artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: sdist
        path: dist/*.tar.gz
        if-no-files-found: error

  check-dist:
    name: Check distributions
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Download distributions
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        path: dist
        merge-multiple: true
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.14'
    - name: Check metadata
      run: |
        python -m pip install twine packaging
        python -m twine check --strict dist/*
    - name: Check that the files are complete and share one version, matching the release
      shell: python
      env:
        EVENT_NAME: ${{ github.event_name }}
        PRERELEASE: ${{ github.event.release.prerelease }}
      run: |
        import itertools
        import os
        import re
        import sys
        import tarfile
        import zipfile
        from email.parser import Parser
        from pathlib import Path

        from packaging.version import Version

        # One wheel is expected for each Python version in CIBW_BUILD on each of these
        # platforms, which correspond to the jobs in the build matrix
        PLATFORMS = ["manylinux_x86_64", "manylinux_aarch64", "macosx_x86_64", "macosx_arm64",
                     "win_amd64"]


        def wheel_target(path):
            # pandana-0.8-cp314-cp314-macosx_15_0_arm64.whl -> ("cp314", "macosx_arm64")
            python, _, platform = path.stem.split("-")[-3:]
            system = re.match(r"[a-z]+", platform).group()
            machine = re.search(r"(x86_64|aarch64|arm64|amd64)$", platform)
            return python, f"{system}_{machine.group() if machine else platform}"


        def metadata_version(path):
            # Read the version from the metadata inside each file, rather than from
            # setup.py or the filename, so that the check binds the release tag to
            # the files being uploaded
            if path.suffix == ".whl":
                with zipfile.ZipFile(path) as z:
                    name = next(n for n in z.namelist() if n.endswith(".dist-info/METADATA"))
                    text = z.read(name).decode()
            else:
                with tarfile.open(path) as t:
                    name = next(n for n in t.getnames() if re.fullmatch(r"[^/]+/PKG-INFO", n))
                    text = t.extractfile(name).read().decode()
            return Parser().parsestr(text)["Version"]


        errors = []
        files = sorted(Path("dist").iterdir())
        wheels = [f for f in files if f.name.endswith(".whl")]
        sdists = [f for f in files if f.name.endswith(".tar.gz")]
        print(f"{len(wheels)} wheels and {len(sdists)} source distribution(s)")
        if len(sdists) != 1 or len(wheels) + len(sdists) != len(files):
            errors.append("expected wheels plus exactly one source distribution")

        pythons = [build.removesuffix("-*") for build in os.environ["CIBW_BUILD"].split()]
        expected = set(itertools.product(pythons, PLATFORMS))
        built = [wheel_target(f) for f in wheels]
        print(f"expecting {len(expected)} wheels: {' '.join(pythons)} on {' '.join(PLATFORMS)}")
        for label, targets in [
            ("missing", expected - set(built)),
            ("unexpected", set(built) - expected),
            ("duplicate", {t for t in built if built.count(t) > 1}),
        ]:
            if targets:
                names = ", ".join(sorted(f"{python} {platform}" for python, platform in targets))
                errors.append(f"{label} wheels: {names}")

        versions = {}
        for f in wheels + sdists:
            try:
                versions[f.name] = metadata_version(f)
                print(versions[f.name], f.name)
            except Exception as e:
                errors.append(f"could not read the package metadata in {f.name} ({e!r})")
        if len(set(versions.values())) > 1:
            errors.append("the files do not all have the same version")

        if not errors and os.environ["EVENT_NAME"] == "release":
            actual = next(iter(versions.values()))
            tag = os.environ["GITHUB_REF_NAME"]
            prerelease = os.environ["PRERELEASE"] == "true"
            print(f"tag {tag} expects version {tag.removeprefix('v')}; the files report {actual}")
            if tag != "v" + actual:
                errors.append("the package version does not match the release tag")
            # Pip skips pre-release versions by default, so a release candidate has to
            # be marked as a pre-release on GitHub and a final version must not be
            if Version(actual).is_prerelease:
                if not prerelease:
                    errors.append(
                        f"{actual} is a pre-release version, but the GitHub release is "
                        "not marked as a pre-release"
                    )
            elif prerelease:
                errors.append(
                    f"{actual} is a final version, but the GitHub release is marked as "
                    "a pre-release"
                )

        for error in errors:
            print(f"::error::{error}")
        sys.exit(1 if errors else 0)

  publish:
    name: Publish to PyPI
    needs: check-dist
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/pandana/
    permissions:
      id-token: write  # for Trusted Publishing; no other access is needed
    steps:
    - name: Download distributions
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        path: dist
        merge-multiple: true
    - name: Upload to PyPI
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
      with:
        # Files upload one at a time and PyPI refuses re-uploads of a filename, so
        # let a re-run after a partial failure finish the release instead of aborting
        skip-existing: true
