name: Build wheels

on:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-wheels:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: Linux x86_64 wheels
          os: ubuntu-latest
          cibw-archs: x86_64
          openmp: GCC/libgomp OpenMP enabled
        - name: Linux aarch64 wheels
          os: ubuntu-24.04-arm
          cibw-archs: aarch64
          openmp: GCC/libgomp OpenMP enabled
        - name: macOS x86_64 wheels
          os: macos-15-intel
          cibw-archs: x86_64
          openmp: Apple clang with Homebrew libomp bundled by delocate
          macos-target: '14.0'  # Homebrew's Intel libomp bottle is built for Sonoma
        - name: macOS arm64 wheels
          os: macos-15
          cibw-archs: arm64
          openmp: Apple clang with Homebrew libomp bundled by delocate
          macos-target: '15.0'
        - name: Windows AMD64 wheels
          os: windows-latest
          cibw-archs: AMD64
          openmp: MSVC /openmp enabled

    steps:
    - uses: actions/checkout@v7
    - name: Show wheel target
      run: |
        echo "cibuildwheel architectures: ${{ matrix.cibw-archs }}"
        echo "OpenMP target: ${{ matrix.openmp }}"
    - name: Build wheels
      uses: pypa/cibuildwheel@v4.2.0
      env:
        CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
        CIBW_SKIP: "*-musllinux_*"
        CIBW_ARCHS: ${{ matrix.cibw-archs }}
        CIBW_BUILD_VERBOSITY: 1
        CIBW_TEST_REQUIRES: "pytest"
        # Run the unit tests, then confirm the wheel is actually multithreaded.
        CIBW_TEST_COMMAND: >
          python -m pytest --import-mode=importlib {project}/tests -q &&
          python {project}/tests/check_openmp.py
        # macOS: Apple's clang has no OpenMP runtime of its own, so install
        # LLVM's libomp from Homebrew on the runner, point the compiler at it,
        # and let delocate copy the dylib into the wheel so it is self-contained.
        # The deployment target has to match the Homebrew bottle's minimum OS
        # for delocate to accept the library; it differs by architecture. Same approach as Pandarm PR #59
        # (github.com/oturns/pandarm/pull/59).
        CIBW_BEFORE_BUILD_MACOS: brew install libomp
        CIBW_ENVIRONMENT_MACOS: >
          CC=clang
          CXX=clang++
          CPPFLAGS="-I$(brew --prefix libomp)/include"
          LDFLAGS="-L$(brew --prefix libomp)/lib"
          MACOSX_DEPLOYMENT_TARGET=${{ matrix.macos-target }}
        CIBW_REPAIR_WHEEL_COMMAND_MACOS: >
          delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}
    - name: Save artifacts
      uses: actions/upload-artifact@v7
      with:
        name: wheels-${{ matrix.os }}
        path: wheelhouse/*.whl

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'
    - name: Build sdist
      run: |
        python -m pip install --upgrade pip build
        python -m build --sdist
    - name: Save artifact
      uses: actions/upload-artifact@v7
      with:
        name: sdist
        path: dist/*.tar.gz

  publish:
    name: Publish release to PyPI
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/pandana/
    permissions:
      id-token: write
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
    - name: Verify release tag
      shell: bash
      run: |
        package_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' setup.py)
        test "${{ github.event.release.tag_name }}" = "v${package_version}"
    - name: Download distributions
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        path: dist
        merge-multiple: true
    - name: Check distributions
      run: |
        python -m pip install --disable-pip-version-check twine
        python -m twine check dist/*
    - name: Publish distributions
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
