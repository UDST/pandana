name: Build wheels

on:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-wheels:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: Linux x86_64 wheels
          os: ubuntu-latest
          cibw-archs: x86_64
          openmp: GCC/libgomp OpenMP enabled
        - name: macOS x86_64 wheels
          os: macos-15-intel
          cibw-archs: x86_64
          openmp: Apple clang build without OpenMP by default
        - name: macOS arm64 wheels
          os: macos-15
          cibw-archs: arm64
          openmp: Apple clang build without OpenMP by default
        - name: Windows AMD64 wheels
          os: windows-latest
          cibw-archs: AMD64
          openmp: MSVC /openmp enabled

    steps:
    - uses: actions/checkout@v6
    - name: Show wheel target
      run: |
        echo "cibuildwheel architectures: ${{ matrix.cibw-archs }}"
        echo "OpenMP target: ${{ matrix.openmp }}"
    - name: Build wheels
      uses: pypa/cibuildwheel@v4.1.1
      env:
        CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
        CIBW_SKIP: "*-musllinux_*"
        CIBW_ARCHS: ${{ matrix.cibw-archs }}
        CIBW_TEST_REQUIRES: "pytest"
        CIBW_TEST_COMMAND: "python -m pytest --import-mode=importlib {project}/tests -q"
    - name: Save artifacts
      uses: actions/upload-artifact@v7
      with:
        name: wheels-${{ matrix.os }}
        path: wheelhouse/*.whl

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.14'
    - name: Build sdist
      run: |
        python -m pip install --upgrade pip build
        python -m build --sdist
    - name: Save artifact
      uses: actions/upload-artifact@v7
      with:
        name: sdist
        path: dist/*.tar.gz

  publish:
    name: Publish release to PyPI
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/pandana/
    permissions:
      id-token: write
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
    - name: Verify release tag
      shell: bash
      run: |
        package_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' setup.py)
        test "${{ github.event.release.tag_name }}" = "v${package_version}"
    - name: Download distributions
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        path: dist
        merge-multiple: true
    - name: Check distributions
      run: |
        python -m pip install --disable-pip-version-check twine
        python -m twine check dist/*
    - name: Publish distributions
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
